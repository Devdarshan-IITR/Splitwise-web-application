<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitBill -web application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1> SplitBill</h1>
            <p>Split expenses easily with friends</p>
        </header>

        <!-- Add Friends Section -->
        <div class="card">
            <h2> Add Friends</h2>
            <div class="form-group">
                <label for="friendName">Friend Name</label>
                <input type="text" id="friendName" placeholder="Enter friend's name">
            </div>
            <button class="btn btn-primary" onclick="addFriend()">Add Friend</button>
            <div id="friendsList" style="margin-top: 15px;"></div>
        </div>

        <!-- Add Expense Section -->
        <div class="card">
            <h2> Add Expense</h2>
            <div class="form-group">
                <label for="expenseDesc">Description</label>
                <input type="text" id="expenseDesc" placeholder="e.g., Dinner, Movie tickets">
            </div>
            <div class="form-group">
                <label for="expenseAmount">Amount (₹)</label>
                <input type="number" id="expenseAmount" placeholder="Enter amount" min="0" step="0.01">
            </div>
            <div class="form-group">
                <label for="paidBy">Paid By</label>
                <select id="paidBy">
                    <option value="">Select who paid</option>
                </select>
            </div>
            <div class="form-group">
                <label>Split Type</label>
                <div class="split-options">
                    <label><input type="radio" name="splitType" value="equal" checked onchange="toggleSplitOptions()"> Equal Split</label>
                    <label><input type="radio" name="splitType" value="custom" onchange="toggleSplitOptions()"> Custom Split</label>
                </div>
            </div>
            <div class="form-group" id="equalSplitSection">
                <label>Split Among</label>
                <div class="checkbox-group" id="splitAmongCheckboxes"></div>
            </div>
            <div class="form-group" id="customSplitSection" style="display: none;">
                <label>Enter amounts for each friend:</label>
                <div id="customAmounts"></div>
            </div>
            <button class="btn btn-primary" onclick="addExpense()">Add Expense</button>
        </div>

        <!-- Expenses List -->
        <div class="card">
            <h2> Expenses</h2>
            <div id="expensesList">
                <div class="empty-state">No expenses added yet. Add your first expense above!</div>
            </div>
        </div>

        <!-- Balances Summary -->
        <div class="card">
            <h2> Balances</h2>
            <div id="balancesList">
                <div class="empty-state">Add friends and expenses to see balances</div>
            </div>
        </div>

        <!-- Settlement -->
        <div class="card">
            <h2> Settlement</h2>
            <button class="btn btn-secondary" onclick="calculateSettlement()" style="margin-bottom: 15px;">Calculate Who Owes Whom</button>
            <div id="settlementList">
                <div class="empty-state">Click "Calculate" to see who needs to pay whom</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
